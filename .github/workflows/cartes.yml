name: cartes

on:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths: ['profil.ts', 'scripts/**', 'assets/**', '.github/workflows/cartes.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cartes
  cancel-in-progress: true

jobs:
  dessiner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/cartes.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publier sur la branche output
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" commit -qm "Cartes du $(date -u +%F)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
